[workspace]
name = "sgap-2026"
version = "0.1.0"
description = "SGAP 2026"
authors = ["Guillaume Lemaitre <guillaume@probabl.ai>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
convert-to-notebooks = { cmd = "python utils/convert_to_notebooks.py" }
convert-to-executed-notebooks = { cmd = "python utils/convert_to_notebooks.py --execute" }
convert-corrections = { cmd = "python utils/convert_to_notebooks.py --source corrections/python_files --output corrections/notebooks" }
build-book = { cmd = "jupyter-book build book", depends-on = ["convert-to-notebooks"] }
build-jupyterlite = { cmd = "jupyter lite build --contents content --output-dir dist", cwd = "jupyterlite", depends-on = ["convert-to-notebooks"] }
serve-jupyterlite = { cmd = "python -m http.server", cwd = "jupyterlite/dist", depends-on = ["build-jupyterlite"] }
lint = "ruff check . && black --check ."
format = "ruff check --fix . && black ."

[dependencies]
python = "==3.14.7"
notebook = ">=7.4.3,<8"
jupyterlab = ">=4.4.3,<5"
jupytext = ">=1.17.2,<2"
ipykernel = "*"
scikit-learn = "~=1.9.1"
skrub = "~=0.11.0"
skore = "~=0.29.0"
pandas = "*"
matplotlib = "*"
numpy = "*"
scipy = "*"
ruff = "*"
black = "*"
pre-commit = ">=4.6.2,<5"
jupyter-book = ">=1.0.4,<2"
jupyterlite = "*"
jupyterlite-pyodide-kernel = "*"
python-libarchive-c = "*"
